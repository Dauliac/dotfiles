version: "3"
set: [errexit, pipefail, nounset]
shopt: [globstar]
dotenv: [".env.local", ".env"]
tasks:
  default:
    run: "once"
    silent: true
    desc: List available tasks
    cmds:
      - task --list
  init:
    run: "once"
    silent: true
    desc: Setup project
    cmds:
      - lefthook install
    sources:
      - ./lefthook.yaml
      - ./flake.nix
  secrure-boot:
    silent: true
    desc: Generate secure boot keys
    cmds:
      - |
        bootctl status
        sudo sbctl create-keys
  build:
    cmds:
      - nix-fast-build --skip-cached --flake ".#packages"
  install:home-manager:
    cmds:
      - xi home switch .
  install:nix-os:
    silent: true
    desc: Install project
    cmds:
      - xi os switch .
  install:pro:
    silent: true
    desc: Install system-manager (includes home-manager)
    cmds:
      - xi system switch .
  test:
    silent: true
    cmds:
      - |
        nix build \
          '.#dev.driverInteractive' \
        && ./result/bin/nixos-test-driver
