version: "3"
set: [errexit, pipefail, nounset]
shopt: [globstar]
dotenv: [".env.local", ".env"]
tasks:
  default:
    run: "once"
    silent: true
    desc: List available tasks
    cmds:
      - task --list
  init:
    run: "once"
    silent: true
    desc: Setup project
    cmds:
      - lefthook install
    sources:
      - ./lefthook.yaml
      - ./flake.nix
  secrure-boot:
    silent: true
    desc: Generate secure boot keys
    cmds:
      - |
        bootctl status
        sudo sbctl create-keys
  build:
    cmds:
      - nix-fast-build --skip-cached --flake ".#packages"
  install:home-manager:
    cmds:
      - nh home switch .
  install:nix-os:
    silent: true
    desc: Install project
    cmds:
      - nh os switch .
  install:home-manager:pro:
    silent: true
    desc: Install project
    cmds:
      - |
        nh home switch .
        fc-cache -f -v
        gtk-update-icon-cache
        update-desktop-database
      - |
        claude mcp add --transport stdio codemap -- codemap-mcp
  install:pro:
    silent: true
    cmds:
      - system-manager switch --flake '.' --sudo
      - task: install:home-manager:pro
  test:
    silent: true
    cmds:
      - |
        nix build \
          '.#dev.driverInteractive' \
        && ./result/bin/nixos-test-driver
