"$schema" = "https://starship.rs/config-schema.json"

palette = "claude"
add_newline = false

format = """
$directory \
$git_branch$git_status \
${env_var.CLAUDE_MODEL_NERD} \
${env_var.CLAUDE_CONTEXT} \
${env_var.CLAUDE_COST}\
$fill\
${env_var.CLAUDE_RATE_5H}\
"""

[fill]
symbol = " "

[directory]
style = "fg:directory"
format = "[$path]($style)"
truncation_length = 2
truncate_to_repo = true

[git_branch]
symbol = ""
style = "fg:git_branch"
format = "[$branch]($style)"

[git_status]
style = "fg:git_status"
format = "[($all_status$ahead_behind)]($style)"

[env_var.CLAUDE_MODEL_NERD]
variable = "CLAUDE_MODEL_NERD"
format = "[$env_value]($style)"
style = "fg:model"

[env_var.CLAUDE_CONTEXT]
variable = "CLAUDE_CONTEXT"
format = "[$env_value]($style)"
style = "fg:context"

[env_var.CLAUDE_COST]
variable = "CLAUDE_COST"
format = "[$env_value]($style)"
style = "fg:cost"

[env_var.CLAUDE_RATE_5H]
variable = "CLAUDE_RATE_5H"
format = "[$env_value]($style)"
style = "fg:rate"

[palettes.claude]
directory = "#89b4fa"
git_branch = "#a6e3a1"
git_status = "#f9e2af"
model = "#cba6f7"
context = "#89dceb"
cost = "#f5c2e7"
rate = "#fab387"
